name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Protect Architecture
        shell: pwsh
        run: ./tools/Test-Architecture.ps1
      - name: Foundation And Real Transport Tests
        shell: pwsh
        run: ./tools/Test-Foundation.ps1
      - name: Store Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-results
          path: .artifacts/validation/foundation-tests.json
  # Unity checks require a separately provisioned, licensed Tuanjie 1.10.4 agent.
  # Do not run untrusted pull-request scripts on a privileged release machine.
